<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 背景圓角方塊 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5" />
  
  <!-- 網格裝飾 -->
  <line x1="20" y1="40" x2="108" y2="40" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="20" y1="68" x2="108" y2="68" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="20" y1="96" x2="108" y2="96" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- K 線柱 1 (紅漲) -->
  <line x1="36" y1="44" x2="36" y2="88" stroke="#ef4444" stroke-width="2" />
  <rect x="30" y="52" width="12" height="26" rx="2" fill="#ef4444" />

  <!-- K 線柱 2 (綠跌) -->
  <line x1="64" y1="56" x2="64" y2="94" stroke="#22c55e" stroke-width="2" />
  <rect x="58" y="62" width="12" height="20" rx="2" fill="#22c55e" />

  <!-- K 線柱 3 (紅漲衝刺) -->
  <line x1="92" y1="26" x2="92" y2="76" stroke="#f43f5e" stroke-width="2" />
  <rect x="86" y="32" width="12" height="34" rx="2" fill="#f43f5e" filter="url(#glow)" />

  <!-- 動態趨勢波浪線 -->
  <path d="M 24 82 Q 45 74, 60 72 T 96 32 T 108 26" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="108" cy="26" r="4.5" fill="#f43f5e" filter="url(#glow)" />
</svg>
